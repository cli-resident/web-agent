name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DWA_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build --config Release

      - name: Package binary (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          bin_path="build/web_agent"
          if [[ ! -f "$bin_path" ]]; then
            echo "Binary not found: $bin_path"
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          archive="web_agent-${version}-${{ runner.os }}-x64.tar.gz"
          mkdir -p dist
          cp "$bin_path" dist/web_agent
          cp README.md dist/README.md
          cp config.json dist/config.json
          tar -C dist -czf "$archive" web_agent README.md config.json

      - name: Package binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binPath = "build/Release/web_agent.exe"
          if (!(Test-Path $binPath)) {
            throw "Binary not found: $binPath"
          }

          $version = $env:GITHUB_REF_NAME.Substring(1)
          $archive = "web_agent-$version-${{ runner.os }}-x64.zip"

          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item $binPath dist/web_agent.exe -Force
          Copy-Item README.md dist/README.md -Force
          Copy-Item config.json dist/config.json -Force
          Compress-Archive -Path dist/web_agent.exe,dist/README.md,dist/config.json -DestinationPath $archive -Force

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: |
            *.tar.gz
            *.zip
          if-no-files-found: error

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Show files
        run: find release-assets -type f -maxdepth 3

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*
          fail_on_unmatched_files: true
